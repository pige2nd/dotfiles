# Use Alt-b as the tmux prefix instead of Ctrl-b.
unbind C-b
set-option -g prefix M-b
bind-key M-b send-prefix
set -sg escape-time 0
set -g focus-events on
set -g allow-passthrough on
bind-key u run-shell "$HOME/dotfiles/tmux/scripts/session-order prev"
bind-key o run-shell "$HOME/dotfiles/tmux/scripts/session-order next"
bind-key C new-session -c "#{pane_current_path}"
bind-key . command-prompt -I "#S" { rename-session "%%" }
bind-key C-g if-shell -F "#{pane_synchronized}" "setw synchronize-panes off; display-message 'synchronize-panes off'" "setw synchronize-panes on; display-message 'synchronize-panes on'"
bind-key 1 run-shell "$HOME/dotfiles/tmux/scripts/move-window-to-session 1"
bind-key 2 run-shell "$HOME/dotfiles/tmux/scripts/move-window-to-session 2"
bind-key 3 run-shell "$HOME/dotfiles/tmux/scripts/move-window-to-session 3"
bind-key 4 run-shell "$HOME/dotfiles/tmux/scripts/move-window-to-session 4"
bind-key 5 run-shell "$HOME/dotfiles/tmux/scripts/move-window-to-session 5"
bind-key 6 run-shell "$HOME/dotfiles/tmux/scripts/move-window-to-session 6"
bind-key 7 run-shell "$HOME/dotfiles/tmux/scripts/move-window-to-session 7"
bind-key 8 run-shell "$HOME/dotfiles/tmux/scripts/move-window-to-session 8"
bind-key 9 run-shell "$HOME/dotfiles/tmux/scripts/move-window-to-session 9"
bind-key 0 run-shell "$HOME/dotfiles/tmux/scripts/move-window-to-session 10"

# Minimal pane splitting; keep the current pane's working directory.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# --- set window index ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on


# --- codex tmux wezterm-style navigation start ---
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-style "bg=default,fg=default"
set -g status-format[0] "#[align=left] #{E:@codex_status_left}#[align=right]#{?pane_synchronized,#[bg=colour220]#[fg=black]#[bold] SYNC #[default] ,}#[fg=colour249]#[nobold]%H:%M #[default]"
set-hook -g session-created[90] 'run-shell "$HOME/dotfiles/tmux/scripts/status-left"'
set-hook -g session-closed[90] 'run-shell "$HOME/dotfiles/tmux/scripts/status-left"'
set-hook -g session-renamed[90] 'run-shell "$HOME/dotfiles/tmux/scripts/status-left"'
run-shell "$HOME/dotfiles/tmux/scripts/status-left"

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim|vim)$'"
bind-key -n M-i select-pane -U
bind-key -n M-j select-pane -L
bind-key -n M-k select-pane -D
bind-key -n M-l select-pane -R

bind-key -n M-I resize-pane -U 3
bind-key -n M-J resize-pane -L 3
bind-key -n M-K resize-pane -D 3
bind-key -n M-L resize-pane -R 3
bind-key -n M-f resize-pane -Z
bind-key -n M-q kill-pane

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-u previous-window
bind-key -n M-o next-window
bind-key -n M-U run-shell "$HOME/dotfiles/tmux/scripts/session-order prev"
bind-key -n M-O run-shell "$HOME/dotfiles/tmux/scripts/session-order next"
bind-key -n M-Left run-shell "$HOME/dotfiles/tmux/scripts/session-order move-left"
bind-key -n M-Right run-shell "$HOME/dotfiles/tmux/scripts/session-order move-right"
bind-key -n C-1 run-shell -b "$HOME/dotfiles/tmux/scripts/switch-session-by-index 1"
bind-key -n C-2 run-shell -b "$HOME/dotfiles/tmux/scripts/switch-session-by-index 2"
bind-key -n C-3 run-shell -b "$HOME/dotfiles/tmux/scripts/switch-session-by-index 3"
bind-key -n C-4 run-shell -b "$HOME/dotfiles/tmux/scripts/switch-session-by-index 4"
bind-key -n C-5 run-shell -b "$HOME/dotfiles/tmux/scripts/switch-session-by-index 5"
bind-key -n C-6 run-shell -b "$HOME/dotfiles/tmux/scripts/switch-session-by-index 6"
bind-key -n C-7 run-shell -b "$HOME/dotfiles/tmux/scripts/switch-session-by-index 7"
bind-key -n C-8 run-shell -b "$HOME/dotfiles/tmux/scripts/switch-session-by-index 8"
bind-key -n C-9 run-shell -b "$HOME/dotfiles/tmux/scripts/switch-session-by-index 9"
# --- codex tmux wezterm-style navigation end ---

# Extended keys support for modern TUIs (e.g. Pi agent Shift+Enter)
set -g extended-keys on
set -g extended-keys-format csi-u

# --- codex tmux copy mouse start ---
set -g mode-keys vi
set -g mouse on
set -g history-limit 100000
set -g set-clipboard off

bind-key [ copy-mode
bind-key -n M-v copy-mode
bind-key -n C-S-v run-shell -b "$HOME/dotfiles/tmux/scripts/clipboard-paste | tmux load-buffer - && tmux paste-buffer"
bind-key -n M-V run-shell -b "$HOME/dotfiles/tmux/scripts/clipboard-paste | tmux load-buffer - && tmux paste-buffer"

bind-key -T copy-mode-vi i send-keys -X cursor-up
bind-key -T copy-mode-vi j send-keys -X cursor-left
bind-key -T copy-mode-vi k send-keys -X cursor-down
bind-key -T copy-mode-vi l send-keys -X cursor-right
bind-key -T copy-mode-vi h send-keys -X begin-selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$HOME/dotfiles/tmux/scripts/clipboard-copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$HOME/dotfiles/tmux/scripts/clipboard-copy"
bind-key -T copy-mode-vi C-S-v send-keys -X cancel \; run-shell -b "$HOME/dotfiles/tmux/scripts/clipboard-paste | tmux load-buffer - && tmux paste-buffer"
bind-key -T copy-mode-vi M-V send-keys -X cancel \; run-shell -b "$HOME/dotfiles/tmux/scripts/clipboard-paste | tmux load-buffer - && tmux paste-buffer"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$HOME/dotfiles/tmux/scripts/clipboard-copy"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "$HOME/dotfiles/tmux/scripts/clipboard-copy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "$HOME/dotfiles/tmux/scripts/clipboard-copy"

bind-key -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{alternate_on}}" "send-keys -M" "copy-mode -e"
bind-key -n WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -M" "send-keys -M"
# --- codex tmux copy mouse end ---

# --- codex tmux persistence plugins start ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'script lazygit yazi'

run '~/.tmux/plugins/tpm/tpm'
# --- codex tmux persistence plugins end ---
