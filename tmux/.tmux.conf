# Use Alt-b as the tmux prefix instead of Ctrl-b.
unbind C-b
set-option -g prefix M-b
bind-key M-b send-prefix
set -sg escape-time 0
bind-key u switch-client -p
bind-key o switch-client -n

# Minimal pane splitting; keep the current pane's working directory.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# --- set window index ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on


# --- codex tmux wezterm-style navigation start ---
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-style "bg=default,fg=default"
set -g status-format[0] "#[align=left]#{S:#{?#{==:#{session_name},#{client_session}},#[bg=colour238]#[fg=colour255]#[bold] #{session_name} #[fg=colour245]|#{W: #[bg=colour238]#[fg=colour114]#{window_index}:#{window_name}#[default]#[bg=colour238] ,#[bg=colour114]#[fg=black]#[bold] #{window_index}:#{window_name} #[bg=colour238]}#[default] ,#[fg=colour39]#{session_name} #[default]}}#[align=right]#{?pane_synchronized,#[bg=colour220]#[fg=black]#[bold] SYNC #[default] ,}%H:%M "

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim|vim)$'"
bind-key -n M-i select-pane -U
bind-key -n M-j select-pane -L
bind-key -n M-k select-pane -D
bind-key -n M-l select-pane -R

bind-key -n M-I resize-pane -U 3
bind-key -n M-J resize-pane -L 3
bind-key -n M-K resize-pane -D 3
bind-key -n M-L resize-pane -R 3
bind-key -n M-f resize-pane -Z
bind-key -n M-q kill-pane

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-u previous-window
bind-key -n M-o next-window
bind-key -n M-U switch-client -p
bind-key -n M-O switch-client -n
# --- codex tmux wezterm-style navigation end ---

# Extended keys support for modern TUIs (e.g. Pi agent Shift+Enter)
set -g extended-keys on
set -g extended-keys-format csi-u

# --- codex tmux copy mouse start ---
set -g mode-keys vi
set -g mouse on
set -g history-limit 100000
set -g set-clipboard off

bind-key [ copy-mode

bind-key -T copy-mode-vi i send-keys -X cursor-up
bind-key -T copy-mode-vi j send-keys -X cursor-left
bind-key -T copy-mode-vi k send-keys -X cursor-down
bind-key -T copy-mode-vi l send-keys -X cursor-right
bind-key -T copy-mode-vi h send-keys -X begin-selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "iconv -s -f UTF-8 -t UTF-16LE | /mnt/c/Windows/System32/clip.exe"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "iconv -s -f UTF-8 -t UTF-16LE | /mnt/c/Windows/System32/clip.exe"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "iconv -s -f UTF-8 -t UTF-16LE | /mnt/c/Windows/System32/clip.exe"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "iconv -s -f UTF-8 -t UTF-16LE | /mnt/c/Windows/System32/clip.exe"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "iconv -s -f UTF-8 -t UTF-16LE | /mnt/c/Windows/System32/clip.exe"

bind-key -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{alternate_on}}" "send-keys -M" "copy-mode -e"
bind-key -n WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -M" "send-keys -M"
# --- codex tmux copy mouse end ---

# --- codex tmux persistence plugins start ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
# --- codex tmux persistence plugins end ---
