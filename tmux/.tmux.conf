# Use Alt-b as the tmux prefix instead of Ctrl-b.
unbind C-b
set-option -g prefix M-b
bind-key M-b send-prefix

# Minimal pane splitting; keep the current pane's working directory.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# --- codex tmux wezterm-style navigation start ---
set -g status-position top
set -g status-interval 1
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[reverse] #I:#W #[default]"

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim|vim)$'"
bind-key -n M-i if-shell "$is_vim" "send-keys M-i" "select-pane -U"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -L"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -D"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"

bind-key -n M-I resize-pane -U 5
bind-key -n M-J resize-pane -L 5
bind-key -n M-K resize-pane -D 5
bind-key -n M-L resize-pane -R 5

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
# --- codex tmux wezterm-style navigation end ---

# --- codex tmux copy mouse start ---
set -g mode-keys vi
set -g mouse on
set -g history-limit 100000
set -g set-clipboard on

bind-key [ copy-mode

bind-key -T copy-mode-vi i send-keys -X cursor-up
bind-key -T copy-mode-vi j send-keys -X cursor-left
bind-key -T copy-mode-vi k send-keys -X cursor-down
bind-key -T copy-mode-vi l send-keys -X cursor-right
bind-key -T copy-mode-vi h send-keys -X begin-selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "clip.exe"

bind-key -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{alternate_on}}" "send-keys -M" "copy-mode -e"
bind-key -n WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -M" "send-keys -M"
# --- codex tmux copy mouse end ---

# --- codex tmux persistence plugins start ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
# --- codex tmux persistence plugins end ---
