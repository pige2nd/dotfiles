[preview]
wrap = "yes"
image_filter = "lanczos3"
max_size = 10485760

[tasks]
image_alloc = 536870912

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*"
run = "mactag"
group = "mactag"

[[plugin.prepend_fetchers]]
url = "*/"
run = "mactag"
group = "mactag"

# Media/image preview with thumbnails plus metadata, from emoeem/yazi's mediainfo setup.
[[plugin.prepend_previewers]]
mime = "{audio,video,image}/*"
run = "mediainfo"

[[plugin.prepend_previewers]]
mime = "application/{subrip,postscript,illustrator,dvb.ait,vnd.adobe.illustrator,eps}"
run = "mediainfo"

[[plugin.prepend_previewers]]
url = "*.{ai,eps,ait,psd}"
run = "mediainfo"

[[plugin.prepend_preloaders]]
mime = "{audio,video,image}/*"
run = "mediainfo"

[[plugin.prepend_preloaders]]
mime = "application/{subrip,postscript,illustrator,dvb.ait,vnd.adobe.illustrator,eps}"
run = "mediainfo"

[[plugin.prepend_preloaders]]
url = "*.{ai,eps,ait,psd}"
run = "mediainfo"

# Lightweight Office preview without LibreOffice: docx/odt/rtf via pandoc/textutil,
# xlsx/pptx via OOXML extraction, legacy doc/xls/ppt via textutil/strings fallback.
[[plugin.prepend_previewers]]
url = "*.{doc,docx,rtf,odt,xls,xlsx,ppt,pptx,DOC,DOCX,RTF,ODT,XLS,XLSX,PPT,PPTX}"
run = 'piper --wrap -- "$HOME/.config/yazi/scripts/office-preview" "$1"'

# Markdown preview via glow, wrapped by piper so it renders inside Yazi's preview pane.
[[plugin.prepend_previewers]]
url = "*.{md,markdown,MD,MARKDOWN}"
run = 'piper --wrap -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# Directory preview as an eza tree.
[[plugin.prepend_previewers]]
url = "*/"
run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"'

[opener]
extract = [
	{ run = "ya pub augmented-extract --list %s", desc = "Extract here" },
]
