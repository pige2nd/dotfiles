# --- ijkl navigation, powered by augment-command ---
[[mgr.prepend_keymap]]
on = "i"
run = "plugin augment-command.arrow -- -1"
desc = "Move cursor up with wraparound"

[[mgr.prepend_keymap]]
on = "j"
run = "plugin augment-command.leave"
desc = "Go back to parent directory, skipping single-child directories"

[[mgr.prepend_keymap]]
on = "k"
run = "plugin augment-command.arrow -- 1"
desc = "Move cursor down with wraparound"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin augment-command.enter"
desc = "Smart enter/open, including archives"

[[mgr.prepend_keymap]]
on = "h"
run = "plugin searchjump"
desc = "Searchjump with pinyin initial matching"

[[mgr.prepend_keymap]]
on = "p"
run = "plugin augment-command.paste"
desc = "Smart paste into hovered directory or CWD"

[[mgr.prepend_keymap]]
on = "q"
run = "plugin augment-command.quit"
desc = "Quit, confirm when multiple tabs are open"

[[mgr.prepend_keymap]]
on = "a"
run = "plugin augment-command.create"
desc = "Create file or directory, enter new directories"

[[mgr.prepend_keymap]]
on = "r"
run = "plugin augment-command.rename -- --cursor=before_ext"
desc = "Rename hovered/selected item"

[[mgr.prepend_keymap]]
on = "A"
run = "plugin augment-command.archive"
desc = "Archive hovered/selected items"

[[mgr.prepend_keymap]]
on = [ "t", "n" ]
run = "plugin augment-command.tab-create"
desc = "Create tab in hovered directory"

[[mgr.prepend_keymap]]
on = [ "t", "1" ]
run = "plugin augment-command.tab-switch -- 0"
desc = "Switch/create tab 1"

[[mgr.prepend_keymap]]
on = [ "t", "2" ]
run = "plugin augment-command.tab-switch -- 1"
desc = "Switch/create tab 2"

[[mgr.prepend_keymap]]
on = [ "t", "3" ]
run = "plugin augment-command.tab-switch -- 2"
desc = "Switch/create tab 3"

[[mgr.prepend_keymap]]
on = "f"
run = "plugin jump-to-char"
desc = "Jump to char"

[[mgr.prepend_keymap]]
on = "F"
run = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on = [ "t", "p" ]
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on = [ "t", "r" ]
run = "plugin toggle-pane reset"
desc = "Reset pane layout"

[[mgr.prepend_keymap]]
on = "+"
run = "plugin zoom 1"
desc = "Zoom in hovered image"

[[mgr.prepend_keymap]]
on = "-"
run = "plugin zoom -1"
desc = "Zoom out hovered image"

[[mgr.prepend_keymap]]
on = [ "m", "i" ]
run = "plugin mediainfo -- toggle-metadata"
desc = "Toggle media/image metadata in preview"

[[mgr.prepend_keymap]]
on = [ "m", "p" ]
run = "plugin mediainfo -- toggle-preview"
desc = "Toggle media/image thumbnail in preview"

[[mgr.prepend_keymap]]
on = [ "m", "r" ]
run = "plugin mediainfo -- reset"
desc = "Reset media/image preview options"

[[mgr.prepend_keymap]]
on = [ "b", "a" ]
run = "plugin mactag add"
desc = "Tag selected files"

[[mgr.prepend_keymap]]
on = [ "b", "r" ]
run = "plugin mactag remove"
desc = "Untag selected files"

# --- pref-by-location start ---
[[mgr.prepend_keymap]]
on = "."
run = ["hidden toggle", "plugin pref-by-location -- save"]
desc = "Toggle hidden files and save this directory preference"

[[mgr.prepend_keymap]]
on = ["m", "s"]
run = ["linemode size", "plugin pref-by-location -- save"]
desc = "Line mode: size (save for this directory)"

[[mgr.prepend_keymap]]
on = ["m", "P"]
run = ["linemode permissions", "plugin pref-by-location -- save"]
desc = "Line mode: permissions (save for this directory)"

[[mgr.prepend_keymap]]
on = ["m", "b"]
run = ["linemode btime", "plugin pref-by-location -- save"]
desc = "Line mode: birth time (save for this directory)"

[[mgr.prepend_keymap]]
on = ["m", "m"]
run = ["linemode mtime", "plugin pref-by-location -- save"]
desc = "Line mode: modified time (save for this directory)"

[[mgr.prepend_keymap]]
on = ["m", "o"]
run = ["linemode owner", "plugin pref-by-location -- save"]
desc = "Line mode: owner (save for this directory)"

[[mgr.prepend_keymap]]
on = ["m", "n"]
run = ["linemode none", "plugin pref-by-location -- save"]
desc = "Line mode: none (save for this directory)"

[[mgr.prepend_keymap]]
on = [",", "t"]
run = "plugin pref-by-location -- toggle"
desc = "Toggle automatic directory preferences"

[[mgr.prepend_keymap]]
on = [",", "R"]
run = "plugin pref-by-location -- reset"
desc = "Reset preferences for the current directory"

[[mgr.prepend_keymap]]
on = [",", "m"]
run = ["sort mtime --reverse=no", "linemode mtime", "plugin pref-by-location -- save"]
desc = "Sort by modified time (save for this directory)"

[[mgr.prepend_keymap]]
on = [",", "M"]
run = ["sort mtime --reverse", "linemode mtime", "plugin pref-by-location -- save"]
desc = "Sort by modified time, reverse (save for this directory)"

[[mgr.prepend_keymap]]
on = [",", "b"]
run = ["sort btime --reverse=no", "linemode btime", "plugin pref-by-location -- save"]
desc = "Sort by birth time (save for this directory)"

[[mgr.prepend_keymap]]
on = [",", "B"]
run = ["sort btime --reverse", "linemode btime", "plugin pref-by-location -- save"]
desc = "Sort by birth time, reverse (save for this directory)"

[[mgr.prepend_keymap]]
on = [",", "e"]
run = ["sort extension --reverse=no", "plugin pref-by-location -- save"]
