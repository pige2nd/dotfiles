# Kitty config
# Docs: https://sw.kovidgoyal.net/kitty/conf/

# --- Shell ---
shell /bin/zsh
shell_integration enabled

# --- Font ---
font_family Maple Mono NF CN
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.5
adjust_line_height 110%
disable_ligatures always

# --- Window / macOS ---
window_padding_width 8
background_opacity 1.0
dynamic_background_opacity no
macos_option_as_alt yes
macos_titlebar_color background
confirm_os_window_close 0
remember_window_size yes
initial_window_width 110c
initial_window_height 32c

# --- Cursor / bell / scrollback ---
cursor_shape beam
cursor_blink_interval 0.5
scrollback_lines 20000
enable_audio_bell no
visual_bell_duration 0.0

# --- Clipboard / URLs ---
copy_on_select clipboard
strip_trailing_spaces smart
detect_urls yes
open_url_with default

# --- Tabs ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {title} "
active_tab_font_style bold
inactive_tab_font_style normal

# --- Keybindings ---
# New tabs/windows keep the current directory.
map cmd+t new_tab_with_cwd
map cmd+enter new_window_with_cwd
map cmd+d launch --cwd=current --location=vsplit
map cmd+shift+d launch --cwd=current --location=hsplit

# Tab switching.
map cmd+shift+[ previous_tab
map cmd+shift+] next_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Pane navigation.
map cmd+alt+left neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up neighboring_window up
map cmd+alt+down neighboring_window down

# Font size.
map cmd+plus change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 restore_font_size

# Terminal cleanup.
map cmd+k clear_terminal reset active

# --- Theme: Amber Manpage, ported from ~/.config/wezterm/amber-manpage.lua ---
foreground #FFF4DF
background #1E1A14
selection_foreground #FEFEFE
selection_background #4A4032
cursor #D4A65A
cursor_text_color #1E1A14
url_color #4E9ED8

active_border_color #D4A65A
inactive_border_color #4A4032
bell_border_color #D8A12E

tab_bar_background #1E1A14
active_tab_foreground #1E1A14
active_tab_background #D4A65A
inactive_tab_foreground #9B907E
inactive_tab_background #2A241C

