"$schema" = 'https://starship.rs/config-schema.json'

# Catppuccin Mocha 风格：双行提示符，不额外插入空白行。
palette = 'catppuccin_mocha'
add_newline = false
scan_timeout = 30
command_timeout = 500

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$conda\
${custom.python_runtime}\
$python\
$nodejs\
$rust\
$golang\
${custom.docker_runtime}\
$cmd_duration\
$line_break\
$character"""

[palettes.catppuccin_mocha]
blue = '#89b4fa'
green = '#a6e3a1'
yellow = '#f9e2af'
red = '#f38ba8'
mauve = '#cba6f7'
teal = '#94e2d5'
peach = '#fab387'
overlay0 = '#6c7086'

[directory]
style = 'bold blue'
format = 'in [$path]($style) '
truncation_length = 3
truncate_to_repo = true
home_symbol = '~'
read_only = ' ro'
read_only_style = 'red'

[username]
show_always = true
style_user = 'bold mauve'
style_root = 'bold red'
format = '[$user]($style) '

[git_branch]
symbol = 'git '
style = 'bold mauve'
format = 'on [$symbol$branch]($style) '

[git_status]
style = 'red'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '=${count}'
ahead = '>${count}'
behind = '<${count}'
diverged = '<>${ahead_count}/${behind_count}'
untracked = '?${count}'
stashed = '≡${count}'
modified = '!${count}'
staged = '+${count}'
renamed = 'r${count}'
deleted = 'x${count}'

[fill]
symbol = ' '
style = 'none'

[conda]
format = 'via [󰌠 \($environment\)](bold green) '
ignore_base = false

[custom.python_runtime]
command = "python --version 2>&1 | awk '{print $2}'"
when = 'test -n "$CONDA_DEFAULT_ENV" && command -v python >/dev/null 2>&1'
shell = ['sh']
style = 'yellow'
format = '[v$output]($style) '
description = 'Active Python runtime'

[python]
# WezTerm wezterm.nerdfonts.dev_python
symbol = ' '
style = 'yellow'
format = 'via [$symbol$version]($style) '
# Conda 已由上方模块显示环境名和 Python 版本，避免重复。
detect_env_vars = ['VIRTUAL_ENV', '!CONDA_DEFAULT_ENV']

[nodejs]
# WezTerm wezterm.nerdfonts.dev_nodejs_small
symbol = ' '
style = 'green'
format = 'via [$symbol$version]($style) '

[rust]
# WezTerm wezterm.nerdfonts.dev_rust
symbol = ' '
style = 'peach'
format = 'via [$symbol$version]($style) '

[golang]
# WezTerm wezterm.nerdfonts.dev_go
symbol = ' '
style = 'teal'
format = 'via [$symbol$version]($style) '

[custom.docker_runtime]
command = "docker version --format '{{.Client.Version}}'"
when = 'command -v docker >/dev/null 2>&1'
shell = ['sh']
style = 'blue'
# WezTerm wezterm.nerdfonts.dev_docker
format = 'via [ v$output]($style) '
description = 'Docker client runtime'

[cmd_duration]
min_time = 2000
style = 'yellow'
format = 'took [$duration]($style) '

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[×](bold red)'
vimcmd_symbol = '[‹](bold yellow)'
